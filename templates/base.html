<!DOCTYPE html>
<html lang="{{ lang }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="content-type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page is defined and page.title %}{{ page.title }} - {{ config.title }}{% elif section is defined and section.title %}{{ section.title }} - {{ config.title }}{% else %}{{ config.title }}{% endif %}</title>
    <meta name="description" content="{% if page is defined and page.description %}{{ page.description }}{% elif section is defined and section.description %}{{ section.description }}{% else %}{{ config.description }}{% endif %}">
    <link rel="canonical" href="{{ current_url }}">
    <link rel="alternate" type="application/atom+xml" title="{{ config.title }}" href="{{ get_url(path='atom.xml') }}">
    <link rel="icon" href="/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="/css/normalize.css" type="text/css">
    <link rel="stylesheet" href="/css/sakura.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">
    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body>
    <nav>
      <ul>
        <li><a href="/">home</a></li>
        <li><a href="/blog/">blog</a></li>
        <li><a href="/docs/">docs</a></li>
        <li><a href="/search/">search</a></li>
        <li><a href="https://github.com/laydros">repo</a></li>
        <li><a href="/about/">about</a></li>
      </ul>
    </nav>
    <br />
    <main>
      {% block content %}{% endblock content %}
    </main>
    <div id="footer">
      <a href="https://laydros.net/">&#169; {{ now() | date(format="%Y") }} jwh</a> &nbsp;&mdash;&nbsp; <b>contact</b>: jwh at laydros dot net
    </div>
  </body>
</html>
